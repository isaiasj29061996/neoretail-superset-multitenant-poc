version: "1.0"
policy:
  tenant_source: authenticated_session
  sql_mode: fixed_allowlisted_read_only
  numeric_source: metric_api
  llm_role: explanation_only
  default_period: MTD
  max_result_rows: 10

metrics:
  sales:
    display_name: Vendas
    formula_version: v9-baseline
    formula: "CASE WHEN SUM(faturamento) > 0 THEN SUM(faturamento) ELSE SUM(volume_unidades * avg_sales_price) END"
    description: Valor de venda sell-out no último período disponível do tenant.
    source: gold.nr_overview_history
    periods: [MTD, M-1, U3M]
    format: currency
    statuses:
      technical: discovery
      business: pending
      temporal: PARCIAL_CALENDARIO
    owners: { technical: data_team, business: pending }
    ai: { query_allowed: true, explain_allowed: true }
    evidence:
      validator: superset/validate_overview.py

  percentual_osa:
    display_name: "% OSA"
    formula_version: v9-baseline
    formula: "100 * (1 - SUM(qtd_problemas_osa) / NULLIF(SUM(qtd_item_ativo_osa), 0))"
    description: Percentual de itens ativos sem problema de OSA no período.
    source: gold.nr_overview_history
    periods: [MTD, M-1, U3M]
    format: percent
    statuses:
      technical: discovery
      business: pending
      temporal: PARCIAL_CALENDARIO
    owners: { technical: data_team, business: pending }
    ai: { query_allowed: true, explain_allowed: true }
    evidence:
      validator: superset/validate_overview.py

  tvd:
    display_name: TVD - Pré-ruptura
    formula_version: v9-baseline
    formula: "SUM(tvd)"
    description: Oportunidade de pré-ruptura no último dia disponível.
    source: gold.nr_tvd_daily
    periods: [MTD, M-1, U3M]
    format: currency
    statuses:
      technical: discovery
      business: pending
      temporal: PARCIAL_CALENDARIO
    owners: { technical: data_team, business: pending }
    ai: { query_allowed: true, explain_allowed: true }
    evidence:
      validator: superset/validate_stock_optimization.py

  ivd:
    display_name: IVD - Excesso de estoque
    formula_version: v9-baseline
    formula: "SUM(ivd_simplificado)"
    description: Oportunidade de excesso de estoque no último dia disponível.
    source: gold.nr_panorama_opportunities
    periods: [MTD, M-1, U3M]
    format: currency
    statuses:
      technical: discovery
      business: pending
      temporal: PARCIAL_CALENDARIO
    owners: { technical: data_team, business: pending }
    ai: { query_allowed: true, explain_allowed: true }
    evidence:
      validator: superset/validate_stock_optimization.py

  stock:
    display_name: Estoque
    formula_version: v9-baseline
    formula: "SUM(estoque_unidades)"
    description: Quantidade de estoque no último período mensal disponível.
    source: gold.nr_overview_history
    periods: [MTD, M-1, U3M]
    format: number
    statuses:
      technical: discovery
      business: pending
      temporal: PARCIAL_CALENDARIO
    owners: { technical: data_team, business: pending }
    ai: { query_allowed: true, explain_allowed: true }
    evidence:
      validator: superset/validate_overview.py

tools:
  osa_causes:
    source: gold.nr_osa_industry_causes
    max_rows: 10
  stock_tasks:
    source: gold.nr_stock_tasks
    max_rows: 10
  top_opportunities:
    source: gold.nr_panorama_opportunities_latest
    max_rows: 10

filters:
  rede: rede
  bandeira: bandeira
  uf: uf
  cidade: cidade
  tipo_local: tipo_local
  loja: loja
  regiao: regiao
  deposito: deposito
  item: item
  marca: descricao_marca
  hierarquia_1: hierarquia_1
  hierarquia_2: hierarquia_2
  hierarquia_3: hierarquia_3
