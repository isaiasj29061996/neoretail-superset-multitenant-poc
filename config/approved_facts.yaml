    silver_table: fato_diaria
    grain: data_id_item_id_location
    tenant_column: id_customer
    reviewer: Isaias Justo
    status: approved

  - logical_name: fato_semanal
    silver_table: fato_semanal
    grain: id_time_cd_week_id_item_id_location
