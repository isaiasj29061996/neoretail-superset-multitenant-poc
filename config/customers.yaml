version: "9.0"
default_customer: 290

# Identidade corporativa oficial. O id_customer vem de
# DIMENSAO/DIMENSAO_CUSTOMER.snappy.parquet e sera a chave do RLS.
identity:
  source_table: dim_customer_raw
  id_column: id_customer
  name_column: nm_customer
  rls_column: id_customer

# Escopo ativo da POC: somente LACTALIS.
# Horarios permanecem desabilitados ate confirmacao do refresh da nova fonte.
customers:
  - id_customer: 290
    nm_customer: LACTALIS
    display_name: LACTALIS
    source_prefix: FATO/CUSTOMER/DAILY/NM_CUSTOMER=LACTALIS
    source_layout: partitioned_customer_daily_v1
    enabled: true
    modules: [visao_industria, tarefas, exportacao_diaria, exportacao_mensal]
    schedule:
      enabled: false
      timezone: America/Sao_Paulo
      cron: null

validation:
  require_unique_id_customer: true
  require_unique_nm_customer: true
  verify_against_dim_customer: true
  reject_unknown_customer: true
