# POC local. Em produção, usuários e permissões virão do backend NeoRetail.
customers:
  "142":
    name: AMBEV
    modules: [visao_industria, tarefas, exportacao_diaria, exportacao_mensal]

users:
  - username: demo.multitenant
    password_env: DEMO_USER_PASSWORD
    display_name: Analista POC
    allowed_customer_ids: [142]
